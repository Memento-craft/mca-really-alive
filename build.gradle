plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The neural core lives in brain-core so it can be built and tested without Minecraft
// (gradle -p brain-core test). The mod compiles the same sources into its own jar.
sourceSets.main.java.srcDir 'brain-core/src/main/java'
sourceSets.main.resources.srcDir 'brain-core/src/main/resources'

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Only these learning benchmarks, e.g. -Pbenchmarks=TILL,STEP (all when unset).
            systemProperty 'reallyalive.benchmarks', project.findProperty('benchmarks') ?: ''
            // -PsameGenes gives every new brain the default genes (to measure spread between villagers).
            systemProperty 'reallyalive.sameGenes', project.hasProperty('sameGenes') ? 'true' : 'false'
            // -PcraftTicks=N runs the crafting benchmarks for N ticks instead of 150000.
            systemProperty 'reallyalive.craftTicks', project.findProperty('craftTicks') ?: '150000'
            // -PtraceClicks logs every click villagers make on a screen.
            systemProperty 'reallyalive.traceClicks', project.hasProperty('traceClicks') ? 'true' : 'false'
            // Reports where a flood of dropped items comes from, should one start.
            systemProperty 'reallyalive.watchLitter', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Any other mods to try alongside it in dev can be dropped into libs/.
    flatDir { dirs 'libs' }
}

// Mods that are only present in dev runs, never a dependency of the published jar.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // MCA Reborn, so dev runs have MCA villagers to drive. The addon itself only touches vanilla
    // villager classes, so it does not compile against MCA.
    localRuntime "maven.modrinth:minecraft-comes-alive-reborn:${mca_version}"
    // Create, to check that its blocks answer a brain villager's hands: ./gradlew runGameTestServer -Pwith_create
    if (project.hasProperty('with_create') || project.hasProperty('with_aeronautics')) {
        localRuntime "maven.modrinth:create:${create_version}"
    }
    // Create Aeronautics and Sable, its sub-level physics, to check that villagers stand on, see and build on
    // moving sub-levels: ./gradlew runGameTestServer -Pwith_aeronautics
    if (project.hasProperty('with_aeronautics')) {
        localRuntime "maven.modrinth:sable:${sable_version}"
        localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
