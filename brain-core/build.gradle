// The neural core has no Minecraft dependencies, so it builds and tests on its own:
//   gradle -p brain-core test
// The mod build compiles these same sources into the mod jar.
plugins {
    id 'java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // The shared English alone takes about 310 MB; training it (EnglishProbeTest) needs far more.
    maxHeapSize = System.getenv('TEST_HEAP') ?: '2g'
    // -Dreallyalive.<name>=<value> on the command line reaches the tests, for tuning runs.
    System.getProperties().each { k, v -> if (k.toString().startsWith('reallyalive.')) systemProperty k.toString(), v }
    if (System.getenv('MAX_SYNAPSES')) {
        systemProperty 'reallyalive.maxSynapses', System.getenv('MAX_SYNAPSES')
    }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}
